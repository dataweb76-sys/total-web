<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2d5a"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Borde gradiente sutil -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#grad)" stroke-width="10" opacity="0.6"/>

  <!-- Letra L -->
  <text x="68" y="340" font-family="Arial Black, Arial" font-size="290" font-weight="900" fill="url(#gradL)" letter-spacing="-20">L</text>

  <!-- Letra W más pequeña, superpuesta abajo-derecha -->
  <text x="210" y="400" font-family="Arial Black, Arial" font-size="200" font-weight="900" fill="white" opacity="0.95" letter-spacing="-10">W</text>

  <!-- Punto decorativo (dominio .ar) -->
  <circle cx="400" cy="128" r="22" fill="url(#grad)"/>
</svg>
