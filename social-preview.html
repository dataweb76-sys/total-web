<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <title>LocalWeb — Social Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #080c18;
    }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #080c18 0%, #0f1628 50%, #0a0e1a 100%);
    }

    /* Grid background */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.07) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Orbs */
    .orb1 {
      position: absolute;
      width: 700px; height: 700px;
      top: -200px; right: -150px;
      background: radial-gradient(circle, rgba(139,92,246,0.3) 0%, transparent 65%);
      border-radius: 50%;
      filter: blur(40px);
    }
    .orb2 {
      position: absolute;
      width: 500px; height: 500px;
      bottom: -150px; left: -100px;
      background: radial-gradient(circle, rgba(59,130,246,0.25) 0%, transparent 65%);
      border-radius: 50%;
      filter: blur(40px);
    }
    .orb3 {
      position: absolute;
      width: 300px; height: 300px;
      top: 400px; left: 300px;
      background: radial-gradient(circle, rgba(236,72,153,0.1) 0%, transparent 65%);
      border-radius: 50%;
      filter: blur(60px);
    }

    /* Content */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 64px;
      gap: 0;
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(99,102,241,0.15);
      border: 1.5px solid rgba(139,92,246,0.4);
      color: #c4b5fd;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 36px;
    }

    /* Logo */
    .logo {
      font-size: 96px;
      font-weight: 900;
      letter-spacing: -4px;
      line-height: 1;
      margin-bottom: 28px;
    }
    .logo-local { color: #fff; }
    .logo-web {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Tagline */
    .tagline {
      font-size: 32px;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
      text-align: center;
      line-height: 1.3;
      margin-bottom: 52px;
      max-width: 780px;
    }
    .tagline span {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Services pills */
    .services {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-bottom: 56px;
      max-width: 900px;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      border: 1.5px solid;
    }
    .pill.blue   { background: rgba(59,130,246,0.1);  border-color: rgba(59,130,246,0.35);  color: #93c5fd; }
    .pill.purple { background: rgba(139,92,246,0.1);  border-color: rgba(139,92,246,0.35);  color: #c4b5fd; }
    .pill.green  { background: rgba(16,185,129,0.1);  border-color: rgba(16,185,129,0.35);  color: #6ee7b7; }
    .pill.orange { background: rgba(245,158,11,0.1);  border-color: rgba(245,158,11,0.35);  color: #fcd34d; }
    .pill.pink   { background: rgba(236,72,153,0.1);  border-color: rgba(236,72,153,0.35);  color: #f9a8d4; }
    .pill.teal   { background: rgba(6,182,212,0.1);   border-color: rgba(6,182,212,0.35);   color: #67e8f9; }
    .pill.indigo { background: rgba(99,102,241,0.1);  border-color: rgba(99,102,241,0.35);  color: #a5b4fc; }
    .pill.rose   { background: rgba(244,63,94,0.1);   border-color: rgba(244,63,94,0.35);   color: #fda4af; }

    /* Divider */
    .divider {
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(139,92,246,0.6), transparent);
      margin-bottom: 44px;
    }

    /* Contact row */
    .contact-row {
      display: flex;
      align-items: center;
      gap: 40px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 600;
      color: rgba(255,255,255,0.8);
    }
    .contact-item .icon {
      font-size: 28px;
    }
    .contact-sep {
      width: 1px;
      height: 36px;
      background: rgba(255,255,255,0.15);
    }

    /* URL */
    .url-badge {
      margin-top: 36px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(139,92,246,0.15));
      border: 1.5px solid rgba(139,92,246,0.4);
      padding: 14px 36px;
      border-radius: 50px;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .url-dot {
      width: 10px; height: 10px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    /* Corner decorations */
    .corner-tl, .corner-br {
      position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%;
      filter: blur(1px);
    }
    .corner-tl {
      top: -60px; left: -60px;
      border: 2px solid rgba(139,92,246,0.2);
    }
    .corner-br {
      bottom: -60px; right: -60px;
      border: 2px solid rgba(59,130,246,0.2);
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="grid"></div>
    <div class="orb1"></div>
    <div class="orb2"></div>
    <div class="orb3"></div>
    <div class="corner-tl"></div>
    <div class="corner-br"></div>

    <div class="content">
      <div class="badge">🚀 Soluciones Digitales</div>

      <div class="logo">
        <span class="logo-local">Local</span><span class="logo-web">Web</span>
      </div>

      <div class="tagline">
        Tu presencia digital,<br /><span>hecha a tu medida</span>
      </div>

      <div class="services">
        <div class="pill blue">🌐 Páginas Web</div>
        <div class="pill purple">🏠 Inmobiliarias</div>
        <div class="pill green">📱 Apps Móviles</div>
        <div class="pill orange">⚙️ Sistemas</div>
        <div class="pill pink">📣 Publicidad en Redes</div>
        <div class="pill teal">👥 Community Manager</div>
        <div class="pill indigo">🎮 Hosting Juegos</div>
        <div class="pill rose">✨ Web a Medida</div>
      </div>

      <div class="divider"></div>

      <div class="contact-row">
        <div class="contact-item">
          <span class="icon">📱</span>
          <span>+54 9 2954 320639</span>
        </div>
        <div class="contact-sep"></div>
        <div class="contact-item">
          <span class="icon">📸</span>
          <span>@datawebdigital</span>
        </div>
      </div>

      <div class="url-badge">
        <div class="url-dot"></div>
        localweb.ar
      </div>
    </div>
  </div>
</body>
</html>
